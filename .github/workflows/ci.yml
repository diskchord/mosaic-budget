name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt
          python -m pip check

      - name: Validate shell scripts
        run: sh -n scripts/generate-secrets.sh ops/backups/backup.sh

      - name: Validate assets and Markdown links
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          from urllib.parse import unquote, urlsplit
          from xml.etree import ElementTree

          root = Path.cwd()
          json.loads((root / "backend/app/static/manifest.webmanifest").read_text())
          ElementTree.parse(root / "backend/app/static/icon.svg")

          markdown_links = re.compile(r"!?\[[^]]*\]\(([^)]+)\)")
          reference_links = re.compile(r"^\s*\[[^]]+\]:\s*(\S+)", re.MULTILINE)
          html_links = re.compile(r"(?:href|src)=[\"']([^\"']+)[\"']")
          ignored_parts = {".git", ".venv", "node_modules", "venv"}
          missing = []

          for document in root.rglob("*.md"):
              if ignored_parts.intersection(document.parts):
                  continue

              text = document.read_text()
              targets = (
                  markdown_links.findall(text)
                  + reference_links.findall(text)
                  + html_links.findall(text)
              )
              for raw_target in targets:
                  target = raw_target.strip()
                  if target.startswith("<") and ">" in target:
                      target = target[1:target.index(">")]
                  else:
                      target = target.split(maxsplit=1)[0]

                  parsed = urlsplit(target)
                  if not parsed.path or parsed.scheme or parsed.netloc:
                      continue

                  relative_path = Path(unquote(parsed.path).lstrip("/"))
                  candidate = root / relative_path if parsed.path.startswith("/") else document.parent / relative_path
                  if not candidate.exists():
                      missing.append(f"{document.relative_to(root)}: {raw_target}")

          if missing:
              raise SystemExit("Missing local Markdown targets:\n" + "\n".join(missing))
          PY

      - name: Validate Docker Compose configuration
        env:
          POSTGRES_PASSWORD: ci-database-password
          APP_SECRET_KEY: ci-secret-key-that-is-at-least-thirty-two-bytes
          APP_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
          BOOTSTRAP_ADMIN_EMAIL: owner@example.com
          BOOTSTRAP_ADMIN_PASSWORD: ci-password-is-not-a-secret
        run: docker compose config --quiet

      - name: Run verification suite
        run: make verify
