name: Bug report
description: Tell us about a reproducible problem in Mosaic Budget.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Mosaic Budget. Remove account numbers, transaction details, tokens, passwords, and other private financial data before submitting.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      placeholder: |
        1. Go to …
        2. Select …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release number or commit SHA where you saw the problem.
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Firefox 128 on Linux
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste only sanitized excerpts. This field is rendered as code.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, account identifiers, and private financial data from this report.
          required: true
