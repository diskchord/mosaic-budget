name: mosaic-budget

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mosaic}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-mosaic}
  APP_NAME: ${APP_NAME:-Mosaic Budget}
  APP_TIMEZONE: ${APP_TIMEZONE:-America/New_York}
  APP_SECRET_KEY: ${APP_SECRET_KEY:?Set APP_SECRET_KEY in .env}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set APP_ENCRYPTION_KEY in .env}
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?Set BOOTSTRAP_ADMIN_EMAIL in .env}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env}
  BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrator}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  TRUSTED_HOSTS: ${TRUSTED_HOSTS:-*}
  SIMPLEFIN_SYNC_INTERVAL_MINUTES: ${SIMPLEFIN_SYNC_INTERVAL_MINUTES:-180}
  SIMPLEFIN_ROUTINE_DAYS: ${SIMPLEFIN_ROUTINE_DAYS:-7}
  SIMPLEFIN_DEEP_DAYS: ${SIMPLEFIN_DEEP_DAYS:-90}
  SIMPLEFIN_MAX_REQUESTS_24H: ${SIMPLEFIN_MAX_REQUESTS_24H:-20}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_TO: ${SMTP_TO:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  SMTP_SSL: ${SMTP_SSL:-false}
  NTFY_URL: ${NTFY_URL:-https://ntfy.sh}
  NTFY_TOPIC: ${NTFY_TOPIC:-}
  NTFY_TOKEN: ${NTFY_TOKEN:-}
  EXTERNAL_HEARTBEAT_URL: ${EXTERNAL_HEARTBEAT_URL:-}
  BACKUP_STALE_HOURS: ${BACKUP_STALE_HOURS:-36}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mosaic}
      POSTGRES_USER: ${POSTGRES_USER:-mosaic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mosaic} -d ${POSTGRES_DB:-mosaic}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    build:
      context: ./backend
    environment: *app-env
    command: ["sh", "-c", "alembic upgrade head && python -m app.bootstrap"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: ./backend
    restart: unless-stopped
    environment: *app-env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers", "--forwarded-allow-ips", "${FORWARDED_ALLOW_IPS:-127.0.0.1}"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck", "web"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: ./backend
    restart: unless-stopped
    environment: *app-env
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck", "worker"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-mosaic}
      PGUSER: ${POSTGRES_USER:-mosaic}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-35}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    volumes:
      - ./ops/backups/backup.sh:/usr/local/bin/mosaic-backup:ro
      - ${BACKUP_PATH:-./backups}:/backups
    command: ["sh", "/usr/local/bin/mosaic-backup"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
